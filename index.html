<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử giao dịch Quỹ Lớp MKA1K46</title>
    <style>
        /* Reset box-sizing và font chữ mặc định cho mọi phần tử */
        * { 
            box-sizing: border-box; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
        }
        /* Định dạng thẻ body */
        body { 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            padding: 15px; 
            margin: 0; 
            color: #1f2937; 
            min-height: 100vh; 
        }
        /* Định dạng khối chứa nội dung chính */
        .container { 
            max-width: 600px; 
            margin: 0 auto; 
        }
        h2 { 
            text-align: center; 
            color: #0f172a; 
            margin-bottom: 20px; 
        }
        .balance-card { 
            background: linear-gradient(to right, #3b82f6 0%, #2563eb 100%); 
            color: white; 
            padding: 20px; 
            border-radius: 12px; 
            text-align: center; 
            margin-bottom: 25px; 
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2); 
        }
        .balance-amount { 
            font-size: 36px; 
            font-weight: bold; 
            margin-top: 5px; 
        }
        .list-header { 
            font-size: 18px; 
            font-weight: 600; 
            margin-bottom: 15px; 
            color: #334155; 
            border-bottom: 2px solid #cbd5e1; 
            padding-bottom: 8px; 
        }
        #transactionList { 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
            padding-bottom: 80px; /* Thêm khoảng trống phía dưới để không bị nút nổi che khuất nội dung */
        }
        .transaction-item { 
            background: #ffffff; 
            padding: 15px; 
            border-radius: 8px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.05); 
        }
        .transaction-info { 
            flex: 1; 
            padding-right: 15px; 
        }
        .reason-text { 
            font-weight: 600; 
            font-size: 16px; 
            color: #1e293b; 
            margin-bottom: 4px; 
        }
        .meta-text { 
            font-size: 13.5px; 
            color: #64748b; 
        }
        .amount-display { 
            font-weight: bold; 
            font-size: 16px; 
            text-align: right; 
            white-space: nowrap; 
        }
        .text-thu { color: #10b981; }
        .text-chi { color: #ef4444; }
        .loading-state { 
            text-align: center; 
            color: #64748b; 
            font-style: italic; 
            padding: 20px 0; 
        }

        /* --- BẮT ĐẦU CSS CHO NÚT NỔI VÀ MODAL QR --- */
        
        /* Nút nổi góc dưới cùng bên phải */
        .floating-qr-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: linear-gradient(to right, #10b981, #059669); /* Tone màu xanh lá nổi bật */
            color: white;
            border: none;
            border-radius: 50px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.4);
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
        }
        .floating-qr-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(16, 185, 129, 0.5);
        }

        /* Lớp phủ đen mờ toàn màn hình */
        .qr-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Cấu hình ẩn hiện mượt mà */
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }
        
        /* Class kích hoạt hiển thị Modal */
        .qr-modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        /* Khung chứa ảnh mã QR */
        .qr-modal-content {
            position: relative;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
            /* Hiệu ứng phóng to nhẹ khi mở */
            transform: scale(0.8);
            transition: transform 0.3s ease;
            max-width: 90%; /* Giới hạn kích thước trên Mobile */
        }
        .qr-modal-overlay.show .qr-modal-content {
            transform: scale(1);
        }

        /* Hình ảnh QR */
        .qr-image {
            width: 100%;
            max-width: 320px;
            border-radius: 8px;
            display: block;
        }

        /* Nút tắt X màu đỏ */
        .close-modal-btn {
            position: absolute;
            top: -12px;
            right: -12px;
            background: #ef4444;
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            border: 2px solid white;
        }
        .close-modal-btn:hover {
            background: #dc2626;
        }
        /* --- KẾT THÚC CSS QR --- */
    </style>
</head>
<body>

<div class="container">
    <h2>Lịch sử giao dịch Quỹ Lớp MKA1K46</h2>
    
    <div class="balance-card">
        <div>Tổng số dư hiện tại</div>
        <div class="balance-amount" id="balanceDisplay">Đang tải dữ liệu...</div>
    </div>

    <div>
        <div class="list-header">Lịch sử thu chi</div>
        <div id="transactionList">
            <div class="loading-state">Đang đồng bộ dữ liệu từ hệ thống...</div>
        </div>
    </div>
</div>

<button class="floating-qr-btn" id="openQrBtn">📷 QR đóng quỹ</button>

<div class="qr-modal-overlay" id="qrModal">
    <div class="qr-modal-content">
        <div class="close-modal-btn" id="closeQrBtn">&times;</div>
        <img src="https://i.postimg.cc/5yhxG8Yb/QR-chu-tien.jpg" alt="Mã QR đóng quỹ lớp" class="qr-image">
    </div>
</div>

<script>
    // --- KHỐI LỆNH XỬ LÝ NÚT NỔI VÀ MODAL QR ---
    const openQrBtn = document.getElementById('openQrBtn');
    const closeQrBtn = document.getElementById('closeQrBtn');
    const qrModal = document.getElementById('qrModal');

    // Hàm mở Popup
    openQrBtn.addEventListener('click', () => {
        qrModal.classList.add('show');
    });

    // Hàm đóng Popup khi bấm dấu X
    closeQrBtn.addEventListener('click', () => {
        qrModal.classList.remove('show');
    });

    // Hàm đóng Popup khi bấm vào vùng xám mờ bên ngoài ảnh
    qrModal.addEventListener('click', (e) => {
        if (e.target === qrModal) {
            qrModal.classList.remove('show');
        }
    });
    // ---------------------------------------------

    // BẮT BUỘC THAY URL CỦA BẠN VÀO ĐÂY
    const API_URL = "https://script.google.com/macros/s/AKfycby1YjlYlMaHO9fuMZvpD6YMB1zu_oJDfMYfi71_AQTStPgkdHg9xmHrbGydkV9hU0n4zg/exec"; 
    
    const balanceDisplay = document.getElementById('balanceDisplay');
    const transactionList = document.getElementById('transactionList');

    const currencyFormatter = new Intl.NumberFormat('vi-VN');

    async function fetchDashboardData(isInitialLoad = false) {
        try {
            const response = await fetch(API_URL);
            const data = await response.json();
            
            balanceDisplay.innerText = currencyFormatter.format(data.balance) + ' đ';
            
            if (data.transactions.length === 0) {
                transactionList.innerHTML = '<div class="loading-state">Chưa có giao dịch nào được ghi nhận.</div>';
                return;
            }

            let newHTMLContent = '';

            data.transactions.forEach(tx => {
                let amountText = '';
                let amountClass = '';
                
                if (tx.thu > 0) {
                    amountText = '+ ' + currencyFormatter.format(tx.thu) + ' đ';
                    amountClass = 'text-thu';
                } else if (tx.chi > 0) {
                    amountText = '- ' + currencyFormatter.format(tx.chi) + ' đ';
                    amountClass = 'text-chi';
                } else {
                    return; 
                }

                let cleanDate = tx.date; 
                let parsedDate = new Date(tx.date); 
                
                if (!isNaN(parsedDate.getTime())) { 
                    let d = parsedDate.getDate().toString().padStart(2, '0'); 
                    let m = (parsedDate.getMonth() + 1).toString().padStart(2, '0'); 
                    let y = parsedDate.getFullYear(); 
                    cleanDate = `${d}/${m}/${y}`; 
                }

                newHTMLContent += `
                    <div class="transaction-item">
                        <div class="transaction-info">
                            <div class="reason-text">${tx.reason}</div>
                            <div class="meta-text">${cleanDate} • ${tx.person}</div>
                        </div>
                        <div class="amount-display ${amountClass}">
                            ${amountText}
                        </div>
                    </div>
                `;
            });

            transactionList.innerHTML = newHTMLContent;

        } catch (error) {
            if (isInitialLoad) {
                balanceDisplay.innerText = 'Lỗi kết nối dữ liệu';
                transactionList.innerHTML = '<div class="loading-state text-chi">Không thể tải dữ liệu. Vui lòng thử lại sau.</div>';
            }
            console.error('Lỗi khi đồng bộ dữ liệu ngầm:', error);
        }
    }

    fetchDashboardData(true);
    setInterval(() => fetchDashboardData(false), 5000);

</script>
</body>
</html>
